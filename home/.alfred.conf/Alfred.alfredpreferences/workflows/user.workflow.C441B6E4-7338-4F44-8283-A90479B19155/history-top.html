<h2 id="banner">
  <span class="icon">
    <img src="/images/icon.png" style="height:100%;"/>
  </span>
  <span id="banner-title">OpenAI Chat API Workflow for Alfred</span>

<h3>Conversation Data</h3>

<div class="button-panel">
  <button id="continue_button"><span class="accent-color"><i class="fas fa-arrow-circle-left"></i></span> Continue Chat</button>
  <button id="reset_button"><span class="accent-color"><i class="fas fa-file-alt"></i></span> Start New Chat</button>
  <button id="export_button" download="history.json"><span class="accent-color"><i class="fas fa-file-download"></i></span> Export Data</button>
  <button id="import_button"><span class="accent-color"><i class="fas fa-file-upload"></i></span> Import Data</button>
</div>
