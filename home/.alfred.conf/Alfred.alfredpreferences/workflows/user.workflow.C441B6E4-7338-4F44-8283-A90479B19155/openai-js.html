function blink(div, message){
  div.className = "blink";
  div.innerText = message;
  // append the div to #openai-response
  document.querySelector("#openai-response").appendChild(div);
  setInterval(function(){
    div.style.opacity = (div.style.opacity == 0 ? 1 : 0);
  }, 480);
}

function progress(selector, message){
  message = message.replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // Create the message div
  let div;
  if(message !== ""){
    div = document.createElement("div");
    div.className = "message user";
    let p = document.createElement("p");
    // set .progress class to the p
    div.appendChild(p);
    p.innerHTML = "<span class='user-color'><i class='fas fa-smile'></i></span> " + message;
    document.querySelector(selector).parentNode.appendChild(div);
  }

  // Create the container
  let container = document.createElement("div");
  container.className = "container";

  // Create and append the face icon
  let face = document.createElement("span");
  face.innerHTML = "<i class='fas fa-smile'></i>";
  container.appendChild(face);

  // Create and append the progress bar
  let bar = document.createElement("div");
  bar.className = "progress";
  container.appendChild(bar);

  // Create and append the robot icon
  let robot = document.createElement("span");
  robot.innerHTML = "<i class='fas fa-robot'></i>";
  container.appendChild(robot);

  // Append the message div and the container to the intended parent
  document.querySelector(selector).parentNode.appendChild(container);

  // Delete the container after 180 seconds
  setTimeout(function(){
    container.remove();
    blink(div, "Something went wrong. Close this window and please try again.");
  }, 180000);
}

function redir(url) {
  url = url.replace(/%/g, "%25").replace(/\+/g, "%2B").replace(/&/g, "%26").replace(/#/g, "%23");
  url = encodeURIComponent(url);
  return url;
}

function changeMessageIcon(classIdName, fa_icon, className){
  let messages = document.querySelectorAll("div" + classIdName);
  for(let i = 0; i < messages.length; i++){
    try {
      let p = messages[i].querySelector("p");
      let d = document.createElement("div");
      d.className = className;
      const role = classIdName.charAt(1).toUpperCase() + classIdName.slice(2);
      d.innerHTML = "<span class='role'><i class='fas " + fa_icon + "'></i> <b>" + role + "</b></span>";
      // insert d before p
      messages[i].insertBefore(d, p);
    }
    catch (error) {
      // do nothing
    }
  }
}

function startStreaming(dom, loopback, websocket_port, initialWait = 0) {
  const streamingCaretInterval = setInterval(() => {
    const rect = streamingCaret.getBoundingClientRect();
    if (rect.top < 0 || rect.bottom > window.innerHeight) {
      streamingCaret.scrollIntoView();
    }
  }, 500);
  const streamingCaret = dom.querySelector("#streaming-caret");

  const maxRetries = 100; // Maximum number of retries
  let retryCount = 0;
  let isConnected = false;

  function connectWebSocket() {
    let ws = null;
    const connectionTimeout = 10000;
  
    try {
      ws = new WebSocket("ws://" + loopback + ":" + websocket_port);
      isConnected = true;
    } catch (error) {
      console.log('WebSocket error:', error);
      return;
    }
  
    const timeoutId = setTimeout(() => {
      if (!isConnected) {
        console.log('WebSocket connection timeout. Closing attempt.');
        if (retryCount < maxRetries) {
          retryCount++;
          setTimeout(connectWebSocket, 1000);
        } else {
          console.log('WebSocket connection timeout. Max retries exceeded.');
          ws.close();
        }
      }
    }, connectionTimeout);
  
    ws.onopen = function() {
      clearTimeout(timeoutId);
      console.log('WebSocket is connected.');
      isConnected = true;
      document.querySelector(".progress").className += " connected";
      retryCount = 0;
    };

    ws.onmessage = function(event) {
      if(event.data === "END_OF_STREAM"){
        ws.close();
        return;
      } else {
        const li = document.createElement('span');
        li.textContent = event.data;
        streamingCaret.before(li);
      }
    };

    ws.onerror = function(error) {
      console.log('WebSocket Error:', error);
      ws.close();
      isConnected = false;
      if (retryCount < maxRetries) {
        retryCount++;
        connectWebSocket();
      } else {
        retryCount = 0;
        console.log('WebSocket connection timeout. Max retries exceeded.');
      }
    };

    ws.onclose = function(event) {
      ws = null;
    };
  }

  try {
    setTimeout(connectWebSocket, initialWait);
  } catch (error) {
    console.log(error);
    const error_message = "❗️ ERROR: websocket error";
    url = "alfred://runtrigger/com.yohasebe.openai/openai-terminate/?argument=error=||=" + error_message
    window.location = url;
  }
}

function exportJSON(){
  let json = document.querySelector("#history_json pre code").innerText;
  // replace `\\"` with `\\\"` (e.g. quoted double qutations inside a quoted double qutations)
  json = json.replace(/\\\\"/g, '\\\\\\"');

  let blob = new Blob([json], {type: "application/json"});
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.href = url;
  a.download = "history.json";
  a.click();
}

function removeEmojis(text){
  // in case of error, return the original text
  try {
    return text.replace(/\p{Extended_Pictographic}/gu, "");
  }
  catch (error) {
    return text;
  }
}

function autoResize(id) {
    let textarea = document.getElementById(id);

    const offset = textarea.offsetHeight - textarea.clientHeight;
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + offset + 'px';
    if (textarea) {
      const offset = textarea.offsetHeight - textarea.clientHeight;
      textarea.addEventListener('input', function (event) {
        event.target.style.height = 'auto';
        event.target.style.height = event.target.scrollHeight + offset + 'px';
      });
      textarea.addEventListener('paste', function (event) {
        event.target.style.height = 'auto';
        event.target.style.height = event.target.scrollHeight + offset + 'px';
      });
      textarea.removeAttribute('data-autoresize');
    } else {
      console.log("Textarea with id: " + id + " not found.");
    }
}
